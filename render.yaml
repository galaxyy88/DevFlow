services:
  - type: web
    name: devflow
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
